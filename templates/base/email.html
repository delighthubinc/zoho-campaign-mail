<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{TITLE}}</title>
  <style>
    @media only screen and (max-width: 640px) {
      .email-shell { width: 100% !important; }
      .mobile-pad { padding-left: 22px !important; padding-right: 22px !important; }
      .speaker-column { display: block !important; width: 100% !important; box-sizing: border-box !important; }
      .brand-logo { width: 150px !important; max-width: 150px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#eef1f5;font-family:Arial,'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#26354a;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#eef1f5;">
    <tr><td align="center" style="padding:24px 0;">
      <table class="email-shell" role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;border-collapse:collapse;background-color:#ffffff;">
        <tr><td class="mobile-pad" style="padding:26px 40px 18px;border-bottom:1px solid #e3e7ed;">
          <img class="brand-logo" src="{{LOGO_URL}}" width="168" alt="{{LOGO_ALT}}" style="display:block;width:168px;max-width:100%;height:auto;border:0;">
        </td></tr>
        <tr><td class="mobile-pad" style="padding:24px 40px 25px;">
          <p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:#26354a;">{{ZOHO_RECIPIENT}}</p>
          <p style="margin:0;font-size:13px;line-height:1.75;color:#657184;">{{RECIPIENT_NOTICE}}</p>
        </td></tr>
        {{CONTENT}}
        <tr><td class="mobile-pad" style="padding:30px 40px;background-color:#102a4c;font-size:13px;line-height:1.8;color:#d8dee8;">
          <p style="margin:0 0 18px;color:#c5a253;">=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=</p>
          <img src="{{CONTACT_IMAGE_URL}}" width="96" alt="{{CONTACT_IMAGE_ALT}}" style="display:block;width:96px;max-width:100%;height:auto;margin:0 0 16px;border:0;border-radius:48px;">
          <p style="margin:0;">{{COMPANY_NAME}}<br>{{DEPARTMENT}} {{CONTACT_NAME}}<br>{{POSTAL_CODE}}<br>{{ADDRESS}}<br>Email <a href="{{EMAIL_HREF}}" style="color:#ffffff;text-decoration:underline;">{{EMAIL}}</a><br>コーポレートサイト <a href="{{CORPORATE_SITE_URL}}" style="color:#ffffff;text-decoration:underline;">{{CORPORATE_SITE_URL}}</a></p>
          <p style="margin:18px 0 0;color:#c5a253;">=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
