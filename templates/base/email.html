<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{TITLE}}</title>
  <style>
    @media only screen and (max-width: 640px) {
      .email-shell { width: 100% !important; }
      .mobile-pad { padding-left: 22px !important; padding-right: 22px !important; }
      .speaker-column { display: block !important; width: 100% !important; box-sizing: border-box !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#eef1f5;font-family:Arial,'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#26354a;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#eef1f5;">
    <tr><td align="center" style="padding:24px 0;">
      <table class="email-shell" role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;border-collapse:collapse;background-color:#ffffff;">
        {{CONTENT}}
        <tr><td align="center" style="padding:28px 24px;background-color:#102a4c;font-size:12px;line-height:1.8;color:#d8dee8;">{{FOOTER}}</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
