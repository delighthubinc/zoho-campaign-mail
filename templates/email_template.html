<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#1f2937;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:collapse;background-color:#ffffff;">
          {{HERO_ROW}}
          <tr>
            <td style="padding:36px 32px;">
              <h1 style="margin:0 0 24px;font-size:26px;line-height:1.5;font-weight:700;color:#111827;">{{HEADING}}</h1>
              {{PARAGRAPHS}}
              {{CTA_ROW}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.7;color:#6b7280;">{{FOOTER}}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
