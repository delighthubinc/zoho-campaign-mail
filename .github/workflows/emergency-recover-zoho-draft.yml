name: EMERGENCY - Recover Zoho Draft Only

on:
  workflow_dispatch:
    inputs:
      campaign_slug:
        description: Recovery対象campaign slug（mainのcampaign.jsonを使用）
        required: true
        type: string
      failed_commit_sha:
        description: reservedを作成した失敗Workflowの40文字commit SHA
        required: true
        type: string
      confirmation:
        description: 重複リスクを確認し CREATE_DRAFT_RECOVERY と入力
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: zoho-draft-recovery-${{ inputs.campaign_slug }}
  cancel-in-progress: false

jobs:
  recover-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require repository administrator and explicit confirmation
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            if (process.env.CONFIRMATION !== 'CREATE_DRAFT_RECOVERY') {
              return core.setFailed('Exact recovery confirmation was not supplied');
            }
            const access = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: context.actor
            });
            if (access.data.user.permission !== 'admin') {
              return core.setFailed('Only repository administrators may run Draft recovery');
            }
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate failed commit and campaign identity
        env:
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
          SLUG: ${{ inputs.campaign_slug }}
        run: |
          [[ "$FAILED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$FAILED_SHA" HEAD
          old_name="$(git show "$FAILED_SHA:campaigns/$SLUG/campaign.json" | jq -r .zoho_campaign_name)"
          current_name="$(jq -r .zoho_campaign_name "campaigns/$SLUG/campaign.json")"
          test -n "$old_name" && test "$old_name" != null && test "$old_name" = "$current_name"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate campaign metadata and published HTML again
        env:
          URL: https://delighthubinc.github.io/zoho-campaign-mail/campaigns/${{ inputs.campaign_slug }}/mail.html
        run: |
          test "$(jq -r .campaign_slug 'campaigns/${{ inputs.campaign_slug }}/campaign.json')" = '${{ inputs.campaign_slug }}'
          python scripts/validate_campaign.py --campaign-slug '${{ inputs.campaign_slug }}' --public-url "$URL" --check-urls
      - name: Permit only a reserved, not-created ledger entry for current main
        id: ledger
        uses: actions/github-script@v7
        env:
          SLUG: ${{ inputs.campaign_slug }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
        with:
          script: |
            const fs = require('fs'); const crypto = require('crypto');
            const data = JSON.parse(fs.readFileSync(`campaigns/${process.env.SLUG}/campaign.json`, 'utf8'));
            const marker = crypto.createHash('sha256').update(`${process.env.FAILED_SHA}\0${data.campaign_slug}\0${data.zoho_campaign_name}`).digest('hex');
            const issues = await github.rest.issues.listForRepo({owner:context.repo.owner, repo:context.repo.repo, state:'open'});
            const issue = issues.data.find(x => x.title === '[automation] Zoho Draft ledger');
            if (!issue) return core.setFailed('No Draft ledger exists; recovery is not applicable');
            const comments = await github.paginate(github.rest.issues.listComments, {owner:context.repo.owner, repo:context.repo.repo, issue_number:issue.number, per_page:100});
            const matching = comments.map(x => x.body || '').filter(x => x.includes(`draft-marker:${marker}`));
            if (!matching.some(x => x.includes('state:reserved'))) return core.setFailed('No reserved marker exists for current main');
            if (matching.some(x => x.includes('state:created'))) return core.setFailed('Draft is already marked created; refusing duplicate recovery');
            if (matching.some(x => x.includes('state:recovery-attempt'))) return core.setFailed('A recovery was already attempted; refusing another possible duplicate');
            core.warning('The prior API result is unknown. Confirm in Zoho Campaigns before using this emergency recovery.');
            core.setOutput('marker', marker); core.setOutput('issue', issue.number);
      - name: Create recovery-attempt ledger entry before API call
        uses: actions/github-script@v7
        env:
          MARKER: ${{ steps.ledger.outputs.marker }}
          ISSUE: ${{ steps.ledger.outputs.issue }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:Number(process.env.ISSUE), body:`draft-marker:${process.env.MARKER}\ncommit:${process.env.FAILED_SHA}\ncampaign:${{ inputs.campaign_slug }}\nstate:recovery-attempt\nactor:${context.actor}`});
      - name: Create Zoho Campaigns Draft only (no send APIs)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: python scripts/create_zoho_draft.py --campaign-file 'campaigns/${{ inputs.campaign_slug }}/campaign.json'
      - name: Mark recovered Draft as created
        uses: actions/github-script@v7
        env:
          MARKER: ${{ steps.ledger.outputs.marker }}
          ISSUE: ${{ steps.ledger.outputs.issue }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:Number(process.env.ISSUE), body:`draft-marker:${process.env.MARKER}\ncommit:${process.env.FAILED_SHA}\ncampaign:${{ inputs.campaign_slug }}\nstate:created-by-recovery\nactor:${context.actor}`});
