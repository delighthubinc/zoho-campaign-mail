name: Create Zoho Draft

on:
  workflow_dispatch:
    inputs:
      campaign_slug:
        description: GitHub Pagesで公開済みのキャンペーンslug
        required: true
        type: string
      campaign_name:
        description: Zoho Campaigns上のキャンペーン名
        required: true
        type: string
      subject:
        description: メール件名
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAMPAIGN_SLUG: ${{ inputs.campaign_slug }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_SUBJECT: ${{ inputs.subject }}
      CONTENT_URL: https://delighthubinc.github.io/zoho-campaign-mail/campaigns/${{ inputs.campaign_slug }}/mail.html
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Confirm mail.html is published on GitHub Pages
        run: |
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$CONTENT_URL")"
          if [ "$status" != "200" ]; then
            echo "Error: GitHub Pagesへの反映を確認できません（HTTP $status）: $CONTENT_URL" >&2
            exit 1
          fi
          echo "GitHub Pages公開確認完了（HTTP 200）: $CONTENT_URL"

      - name: Preview draft details (no external API calls)
        run: |
          python scripts/create_zoho_draft.py \
            --campaign-slug "$CAMPAIGN_SLUG" \
            --campaign-name "$CAMPAIGN_NAME" \
            --subject "$CAMPAIGN_SUBJECT" \
            --mailing-list "過去リスト（新）" \
            --mailing-list "CRMから連携されたリスト" \
            --dry-run

      - name: Create Zoho Campaigns draft
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: |
          python scripts/create_zoho_draft.py \
            --campaign-slug "$CAMPAIGN_SLUG" \
            --campaign-name "$CAMPAIGN_NAME" \
            --subject "$CAMPAIGN_SUBJECT" \
            --mailing-list "過去リスト（新）" \
            --mailing-list "CRMから連携されたリスト"
