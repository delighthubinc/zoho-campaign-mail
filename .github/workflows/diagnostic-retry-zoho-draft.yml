name: EMERGENCY - Diagnostic Retry Zoho Draft Once

on:
  workflow_dispatch:
    inputs:
      campaign_slug:
        description: 診断対象campaign slug（forum-20260910のみ）
        required: true
        type: string
      failed_commit_sha:
        description: 既存markerに対応する40文字commit SHA
        required: true
        type: string
      confirmation:
        description: 一回限定の診断再試行を確認し DIAGNOSTIC_RETRY_ONCE_CONFIRMED と入力
        required: true
        type: string

permissions:
  contents: read
  issues: write

# 通常Recoveryと同じgroupを使い、同じcampaignのledger確認と記録を直列化する。
concurrency:
  group: zoho-draft-recovery-${{ inputs.campaign_slug }}
  cancel-in-progress: false

jobs:
  diagnostic-retry-draft-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main, repository administrator, exact target, and confirmation
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SLUG: ${{ inputs.campaign_slug }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              return core.setFailed('Diagnostic retry must be dispatched from main');
            }
            if (process.env.CONFIRMATION !== 'DIAGNOSTIC_RETRY_ONCE_CONFIRMED') {
              return core.setFailed('Exact diagnostic retry confirmation was not supplied');
            }
            if (process.env.SLUG !== 'forum-20260910' || process.env.FAILED_SHA !== 'bfff863d28c97c1c24f78ee5e7802750e31985dc') {
              return core.setFailed('This diagnostic retry is restricted to the approved existing marker');
            }
            const access = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: context.actor
            });
            if (access.data.permission !== 'admin') {
              return core.setFailed('Only repository administrators may run diagnostic Draft retry');
            }
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate failed commit and campaign identity
        env:
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
          SLUG: ${{ inputs.campaign_slug }}
        run: |
          [[ "$FAILED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$FAILED_SHA" HEAD
          old_name="$(git show "$FAILED_SHA:campaigns/$SLUG/campaign.json" | jq -r .zoho_campaign_name)"
          current_name="$(jq -r .zoho_campaign_name "campaigns/$SLUG/campaign.json")"
          test -n "$old_name" && test "$old_name" != null && test "$old_name" = "$current_name"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate campaign metadata and published HTML again
        env:
          URL: https://delighthubinc.github.io/zoho-campaign-mail/campaigns/${{ inputs.campaign_slug }}/mail.html
        run: |
          test "$(jq -r .campaign_slug 'campaigns/${{ inputs.campaign_slug }}/campaign.json')" = '${{ inputs.campaign_slug }}'
          python scripts/validate_campaign.py --campaign-slug '${{ inputs.campaign_slug }}' --public-url "$URL" --check-urls
      - name: Require the exact failed Recovery history and no completed or diagnostic state
        id: ledger
        uses: actions/github-script@v7
        env:
          SLUG: ${{ inputs.campaign_slug }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const data = JSON.parse(fs.readFileSync(`campaigns/${process.env.SLUG}/campaign.json`, 'utf8'));
            const marker = crypto.createHash('sha256').update(`${process.env.FAILED_SHA}\0${data.campaign_slug}\0${data.zoho_campaign_name}`).digest('hex');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const issue = issues.find(x => x.title === '[automation] Zoho Draft ledger');
            if (!issue) return core.setFailed('No Draft ledger exists; diagnostic retry is not applicable');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100
            });
            const matching = comments.map(x => (x.body || '').split('\n')).filter(lines => lines.includes(`draft-marker:${marker}`));
            const hasState = state => matching.some(lines => lines.includes(`state:${state}`));
            if (!hasState('reserved')) return core.setFailed('Required reserved state is absent');
            if (!hasState('recovery-attempt')) return core.setFailed('Required recovery-attempt state is absent');
            const completedStates = ['created', 'created-by-recovery', 'created-by-recovery-reconciliation', 'created-by-diagnostic-retry'];
            if (completedStates.some(hasState)) return core.setFailed('A created state exists; refusing diagnostic retry');
            if (hasState('diagnostic-retry-attempt')) return core.setFailed('A diagnostic retry was already attempted; refusing a second attempt');
            core.setOutput('marker', marker);
            core.setOutput('issue', issue.number);
      - name: Record diagnostic-retry-attempt before API call
        uses: actions/github-script@v7
        env:
          MARKER: ${{ steps.ledger.outputs.marker }}
          ISSUE: ${{ steps.ledger.outputs.issue }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
          SLUG: ${{ inputs.campaign_slug }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE),
              body: `draft-marker:${process.env.MARKER}\ncommit:${process.env.FAILED_SHA}\ncampaign:${process.env.SLUG}\nstate:diagnostic-retry-attempt\nactor:${context.actor}`
            });
      - name: Create Zoho Campaigns Draft only for diagnostic retry
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: python scripts/create_zoho_draft.py --campaign-file 'campaigns/${{ inputs.campaign_slug }}/campaign.json'
      - name: Mark successful diagnostic Draft as created
        uses: actions/github-script@v7
        env:
          MARKER: ${{ steps.ledger.outputs.marker }}
          ISSUE: ${{ steps.ledger.outputs.issue }}
          FAILED_SHA: ${{ inputs.failed_commit_sha }}
          SLUG: ${{ inputs.campaign_slug }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE),
              body: `draft-marker:${process.env.MARKER}\ncommit:${process.env.FAILED_SHA}\ncampaign:${process.env.SLUG}\nstate:created-by-diagnostic-retry\nactor:${context.actor}`
            });
