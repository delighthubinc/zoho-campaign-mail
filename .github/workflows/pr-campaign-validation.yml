name: PR Campaign Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: campaign-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-campaign:
    name: validate-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      slug: ${{ steps.scope.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restrict production campaign changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile every Python file
        run: find scripts tests -type f -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Validate fixed campaign HTML
        if: steps.scope.outputs.eligible == 'true'
        run: python scripts/validate_campaign.py --campaign-slug "${{ steps.scope.outputs.slug }}"

  enable-auto-merge:
    name: enable-auto-merge
    needs: validate-campaign
    if: >-
      needs.validate-campaign.result == 'success' &&
      needs.validate-campaign.outputs.eligible == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create automation GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CAMPAIGN_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CAMPAIGN_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable protected auto-merge after validation succeeded
        env:
          # App-authored merges emit the main push event used by downstream automation.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash
